# Généré par « harness ci ». Vérification Harness de chaque PR et de main.
# La version du moteur est lue dans .claude/settings.json à chaque exécution.
# Secret requis : HARNESS_DEPLOY_KEY (clé de déploiement en lecture seule
# sur rolandrm/Harness). Règle d'équipe : une PR rouge ne se fusionne pas.
name: Harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  # Annulé par un push plus récent sur une PR seulement : jamais un déploiement en cours
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Harness verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Moteur Harness (version épinglée par le repo)
        env:
          HARNESS_DEPLOY_KEY: ${{ secrets.HARNESS_DEPLOY_KEY }}
        run: |
          if [ -z "$HARNESS_DEPLOY_KEY" ]; then
            echo "::error::Secret HARNESS_DEPLOY_KEY absent : voir la sortie de « harness ci » (clé de déploiement en lecture seule)"
            exit 1
          fi
          REF=$(node -p "require('./.claude/settings.json').extraKnownMarketplaces['harness-tools'].source.ref")
          KEY="$RUNNER_TEMP/harness-key"
          printf '%s\n' "$HARNESS_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone --quiet --depth 1 --branch "$REF" git@github.com:rolandrm/Harness.git "$RUNNER_TEMP/harness"
          rm -f "$KEY"
          echo "HARNESS=$RUNNER_TEMP/harness/bin/harness" >> "$GITHUB_ENV"
          echo "Harness $REF"
      - name: harness verify
        run: node "$HARNESS" verify --summary
