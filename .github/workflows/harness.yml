# Généré par « harness ci ». Vérification Harness de chaque PR et de main.
# La version du moteur est lue dans .claude/settings.json à chaque exécution.
# Secret requis : HARNESS_DEPLOY_KEY (clé de déploiement en lecture seule
# sur rolandrm/Harness). Règle d'équipe : une PR rouge ne se fusionne pas.
# Image ghcr.io/rolandrm/shop-orders : construite sur chaque PR (preuve), publiée sur chaque tag
# vX.Y.Z vérifié (GITHUB_TOKEN, permission packages: write ; aucune clé).
name: Harness

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  # Annulé par un push plus récent sur une PR seulement : jamais un déploiement en cours
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Harness verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Moteur Harness (version épinglée par le repo)
        env:
          HARNESS_DEPLOY_KEY: ${{ secrets.HARNESS_DEPLOY_KEY }}
        run: |
          if [ -z "$HARNESS_DEPLOY_KEY" ]; then
            echo "::error::Secret HARNESS_DEPLOY_KEY absent : voir la sortie de « harness ci » (clé de déploiement en lecture seule)"
            exit 1
          fi
          REF=$(node -p "require('./.claude/settings.json').extraKnownMarketplaces['harness-tools'].source.ref")
          KEY="$RUNNER_TEMP/harness-key"
          printf '%s\n' "$HARNESS_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone --quiet --depth 1 --branch "$REF" git@github.com:rolandrm/Harness.git "$RUNNER_TEMP/harness"
          rm -f "$KEY"
          echo "HARNESS=$RUNNER_TEMP/harness/bin/harness" >> "$GITHUB_ENV"
          echo "Harness $REF"
      - name: harness verify
        run: node "$HARNESS" verify --summary
      - name: Construire l'image (preuve, sans publication)
        run: docker build --file Dockerfile --tag harness-check .

  publish-image:
    name: Publier l'image
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Construire et publier ghcr.io/rolandrm/shop-orders
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Un tag d'image publié ne change jamais : une correction est une nouvelle version
          if docker manifest inspect "ghcr.io/rolandrm/shop-orders:$VERSION" > /dev/null 2>&1; then
            echo "::error::ghcr.io/rolandrm/shop-orders:$VERSION existe déjà : une version publiée ne se republie pas"
            exit 1
          fi
          docker build --file Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "ghcr.io/rolandrm/shop-orders:$VERSION" .
          docker push "ghcr.io/rolandrm/shop-orders:$VERSION"
          echo "Publiée : ghcr.io/rolandrm/shop-orders:$VERSION"
