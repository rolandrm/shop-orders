services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orders}
      POSTGRES_USER: ${POSTGRES_USER:-orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquante}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m

  migrate:
    build:
      context: .
      target: migrate
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-orders}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-orders}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquante}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m

  app:
    build: .
    environment:
      APP_SERVICE_NAME: ${APP_SERVICE_NAME:?APP_SERVICE_NAME manquante}
      SHOP_API_BASE_URL: ${SHOP_API_BASE_URL:?SHOP_API_BASE_URL manquante}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-orders}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-orders}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquante}
    # Docker Engine sous Linux ne définit pas host.docker.internal (Docker Desktop le fait) :
    # sans cette entrée, le conteneur ne joint pas shop-api lancé sur l'hôte. Sans effet sous Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    mem_limit: 512m

volumes:
  db-data:
