spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: false # activé par le profil migrate (étape de migration dédiée)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
    datatype:
      datetime:
        write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /docs/openapi.json
  swagger-ui:
    path: /docs
    enabled: ${API_DOCS_UI:false}

app:
  service-name: ${APP_SERVICE_NAME:}
  shop-api:
    base-url: ${SHOP_API_BASE_URL:}
    connect-timeout: 2s
    read-timeout: 3s

---
spring:
  config:
    activate:
      on-profile: local
app:
  service-name: shop-orders

---
spring:
  config:
    activate:
      on-profile: test

---
spring:
  config:
    activate:
      on-profile: migrate
  main:
    web-application-type: none
  flyway:
    enabled: true
    ignore-migration-patterns: "*:missing"
app:
  service-name: shop-orders-migrate
  shop-api:
    base-url: http://shop-api.invalid # jamais appelée par le conteneur de migration

---
spring:
  config:
    activate:
      on-profile: seed
  flyway:
    locations: classpath:db/migration,classpath:db/seed # données de démonstration, jamais en production

---
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    enabled: false # migrations appliquées par une étape de déploiement dédiée
